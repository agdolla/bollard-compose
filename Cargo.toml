[package]
name = "bollard-compose"
version = "0.1.0"
edition = "2021"
description = "Docker Compose functionality using bollard as the Docker client"
license = "Apache-2.0"

[dependencies]
bollard = { path = "../bollard" }
# bollard = "0.20"

docker-compose-types = "0.22"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
sha2 = "0.10"
shell-words = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
pretty_assertions = "1"
anyhow = "1"
tracing-subscriber = "0.3"

[features]
default = []
integration-tests = []
